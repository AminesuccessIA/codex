name: Articles SEO — préparation hebdomadaire
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Slug du sujet (vide : prochaine priorité du calendrier)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: editorial-weekly
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Préparer le brief et vérifier les sources pour ChatGPT
        run: npm run editorial:brief
        env:
          SEO_TOPIC: ${{ inputs.topic }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-editorial
          path: .editorial/*.md
          if-no-files-found: ignore
