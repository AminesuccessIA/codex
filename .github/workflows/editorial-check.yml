name: Contrôles des articles
on:
  pull_request:
    paths:
      - 'src/content/**'
      - 'src/lib/editorial-*.ts'
      - 'scripts/editorial-*.mjs'
      - 'scripts/lib/editorial.mjs'
      - '.github/workflows/editorial*.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
